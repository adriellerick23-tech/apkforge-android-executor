name: APKForge Android Build

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID da conversão APKForge"
        required: true
        type: string
      package_id:
        description: "Application ID Android"
        required: true
        type: string
      app_name:
        description: "Nome exibido do app"
        required: true
        type: string
      version_name:
        description: "Versão semver"
        required: true
        type: string
      source_url:
        description: "URL HTTPS do site ou bundle ZIP"
        required: true
        type: string
      icon_url:
        description: "URL HTTPS opcional do ícone PNG"
        required: false
        type: string
      source_mode:
        description: "webview ou local"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: apkforge-android-builds
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      JOB_ID: ${{ inputs.job_id }}
      APP_PACKAGE: ${{ inputs.package_id }}
      APP_NAME: ${{ inputs.app_name }}
      VERSION_NAME: ${{ inputs.version_name }}
      SOURCE_URL: ${{ inputs.source_url }}
      ICON_URL: ${{ inputs.icon_url }}
      SOURCE_MODE: ${{ inputs.source_mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Validate and prepare source
        run: |
          test -n "$SOURCE_URL"
          case "$SOURCE_URL" in
            https://*) ;;
            *) echo "SOURCE_URL must use HTTPS"; exit 1 ;;
          esac
          test "$SOURCE_MODE" = "webview" -o "$SOURCE_MODE" = "local"
          if [ "$SOURCE_MODE" = "local" ]; then
            rm -rf /tmp/apkforge-bundle
            mkdir -p /tmp/apkforge-bundle/site
            curl --fail --location --retry 3 --max-time 120 "$SOURCE_URL" -o /tmp/apkforge-bundle/source.zip
            unzip -q /tmp/apkforge-bundle/source.zip -d /tmp/apkforge-bundle/site
            test -f /tmp/apkforge-bundle/site/index.html
            mkdir -p executor/templates/webview/app/src/main/assets
            cp -R /tmp/apkforge-bundle/site/. executor/templates/webview/app/src/main/assets/
          fi

      - name: Prepare optional app icon
        working-directory: executor/templates/webview
        run: |
          if [ -n "$ICON_URL" ]; then
            curl --fail --location --retry 3 --max-time 60 "$ICON_URL" -o /tmp/apkforge-icon-input
            if [ "$(file --mime-type -b /tmp/apkforge-icon-input)" = "image/png" ]; then
              cp /tmp/apkforge-icon-input app/src/main/res/drawable/app_icon.png
              rm -f app/src/main/res/drawable/app_icon.xml
            else
              echo "ICON_NOT_PNG // usando o ícone vetorial seguro"
            fi
          fi

      - name: Configure generated app
        working-directory: executor/templates/webview
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape
          import os
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("applicationId 'com.example.app'", f"applicationId '{os.environ['APP_PACKAGE']}'")
          s = s.replace("versionName '1.0.0'", f"versionName '{os.environ['VERSION_NAME']}'")
          s = s.replace('__APKFORGE_MODE__', os.environ.get('SOURCE_MODE', 'webview'))
          url = os.environ.get('SOURCE_URL') or 'about:blank'
          url_escaped = url.replace('\\', '\\\\').replace('"', '\\"')
          s = s.replace('__APKFORGE_URL__', url_escaped)
          p.write_text(s)
          m = Path('app/src/main/AndroidManifest.xml')
          manifest = m.read_text().replace('APKForge App', escape(os.environ['APP_NAME']))
          m.write_text(manifest)
          PY

      - name: Build debug APK
        working-directory: executor/templates/webview
        run: gradle --no-daemon assembleDebug

      - name: Runtime smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Pixel_2
          disable-animations: true
          script: |
            adb install -r executor/templates/webview/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop "$APP_PACKAGE"
            adb shell monkey -p "$APP_PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 5
            adb shell dumpsys activity activities | grep -q "$APP_PACKAGE"

      - name: Validate APK and compute digest
        working-directory: executor/templates/webview
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          (cd app/build/outputs/apk/debug && sha256sum app-debug.apk) | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apkforge-${{ env.JOB_ID }}
          path: |
            executor/templates/webview/app/build/outputs/apk/debug/app-debug.apk
            executor/templates/webview/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
